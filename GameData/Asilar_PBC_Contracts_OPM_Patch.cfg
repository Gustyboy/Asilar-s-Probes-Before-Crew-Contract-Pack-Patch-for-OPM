// PBC Patch for Asilar's Probes Before Crew Contract Pack for OPM
// This is patching Eeloo because in OPM it's a moon in Sarnus orbit.
// It's also counting landings on Jool's moons to unlock Sarnus contracts the same way Jool Contracts are unlocked.
// Fix an error in Tylo Probe missions labelling.

@CONTRACT_TYPE[ProbeEeloo]:NEEDS[ProbesBeforeCrew,OPM]
{
	@sortKey = 041
	@REQUIREMENT:HAS[#name[r1]]
	{
		@title = Enter the SOI of Sarnus
		@expression = SarnusVisit == 1
	}
}
@CONTRACT_TYPE[CrewEeloo]:NEEDS[ProbesBeforeCrew,OPM]
{
	@sortKey = 042
	@REQUIREMENT:HAS[#name[r1]]
	{
		@title = Enter the SOI of Sarnus
		@expression = SarnusVisit == 1
	}
}
@CONTRACT_TYPE[ProbeLaythe]:NEEDS[ProbesBeforeCrew,OPM]
{
	BEHAVIOUR
	{
		name = JoonsLanded
		type = Expression
		PARAMETER_COMPLETED
		{
			parameter = landPL
			JoonsLanded = $JoonsLanded + 1
		}
	}
}
@CONTRACT_TYPE[CrewLaythe]:NEEDS[ProbesBeforeCrew,OPM]
{
	BEHAVIOUR
